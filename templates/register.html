{% extends "base.html" %}
{% block title %}Register – LibraryMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
          <i class="bi bi-person-plus text-primary"></i> Create Account
        </h2>
        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="name">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="name" name="name"
                     placeholder="John Doe" required autofocus />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="you@example.com" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="At least 6 characters" required minlength="6" />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="confirm_password">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="confirm_password"
                     name="confirm_password" placeholder="••••••••" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-check-circle me-1"></i> Create Account
          </button>
        </form>
        <hr />
        <p class="text-center mb-0 text-muted">
          Already have an account?
          <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
