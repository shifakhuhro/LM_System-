{% extends "base.html" %}
{% block title %}Login – LibraryMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
          <i class="bi bi-book-half text-primary"></i> LibraryMS
        </h2>
        <h5 class="text-center text-muted mb-4">Sign in to your account</h5>
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="you@example.com" required autofocus />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="••••••••" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login
          </button>
        </form>
        <hr />
        <p class="text-center mb-0 text-muted">
          Don't have an account?
          <a href="{{ url_for('register') }}" class="text-decoration-none">Register here</a>
        </p>
      </div>
    </div>

    <!-- Demo credentials info -->
    <div class="card mt-3 border-0 bg-light">
      <div class="card-body py-2 px-3 small text-muted">
        <strong>Demo accounts:</strong><br/>
        Librarian: <code>admin@library.com</code> / <code>admin123</code><br/>
        Register as a regular user to explore borrowing features.
      </div>
    </div>
  </div>
</div>
{% endblock %}
